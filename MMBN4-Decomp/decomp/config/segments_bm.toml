# Segment split for US Blue Moon (B4BE).  Starts and ends are Blue Moon ROM
# addresses.  The +4, +8, +C and +14 insertions relative to Red Sun are kept
# at the end of the preceding code segment, so this layout is contiguous and
# can rebuild Blue Moon exactly while the shared-source merge remains future
# DC-4 work.

version = "bm"
rom_size = 0x800000

[[segment]]
name = "header"
start = 0x08000000
end = 0x080000C0
kind = "header"

[[segment]]
name = "crt0"
start = 0x080000C0
end = 0x0800022C
kind = "code"
mode = "arm"
linear = true
data_from = 0x080001D8
entries = [0x080000C0]

[[segment]]
name = "intr_table"
start = 0x0800022C
end = 0x0800025C
kind = "code"
mode = "arm"
data_from = 0x0800022C

[[segment]]
name = "code_00"
start = 0x0800025C
end = 0x0801002A
kind = "code"
mode = "thumb"

[[segment]]
name = "code_01"
start = 0x0801002A
end = 0x08020D70
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x08011888, end = 0x08012470, fmt = "record", fields = "hbbbbbbu" }, # BN4_ENEMY_STATS (254 x 12B)
]

[[segment]]
name = "code_02"
start = 0x08020D70
end = 0x08035090
kind = "code"
mode = "thumb"

[[segment]]
name = "code_03"
start = 0x08035090
end = 0x0804F228
kind = "code"
mode = "thumb"
# dead code after an unconditional b (no branch or pointer reaches it); decoded for coverage (Claude)
entries = [0x08037C60, 0x08037D38]

[[segment]]
name = "code_04"
start = 0x0804F228
end = 0x0805CF74
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x080523CC, end = 0x08053904, fmt = "word" }, # 723-pointer sprite/object table
]

[[segment]]
name = "code_04b"
start = 0x0805CF74
end = 0x080612DC
kind = "code"
mode = "thumb"

[[segment]]
name = "code_04c"
start = 0x080612DC
end = 0x08067668
kind = "code"
mode = "thumb"

[[segment]]
name = "code_04d"
start = 0x08067668
end = 0x080711F0
kind = "code"
mode = "thumb"

[[segment]]
name = "code_05"
start = 0x080711F0
end = 0x08094764
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x080843FC, end = 0x08085404, fmt = "word" }, # 370-pointer table
]

[[segment]]
name = "code_06"
start = 0x08094764
end = 0x080B01EA
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x080A78D4, end = 0x080A7C34, fmt = "word" }, # 96-pointer table
    { start = 0x080A7C6C, end = 0x080A7ECC, fmt = "word" }, # 96-pointer table
    { start = 0x080A911C, end = 0x080ADD98, fmt = "word" }, # BN4_MYSTERY_DATA (414 pointers, RW+CW)
]

[[segment]]
name = "code_07"
start = 0x080B01EA
end = 0x080D00C4
kind = "code"
mode = "thumb"

[[segment]]
name = "code_08"
start = 0x080D00C4
end = 0x080F001E
kind = "code"
mode = "thumb"

[[segment]]
name = "code_09"
start = 0x080F001E
end = 0x08109F04
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x080F5F5C, end = 0x080F8A7C, fmt = "hword", cols = 10 },              # BN4_REWARD_ROWS (276 x 20 hwords)
    { start = 0x080FA90C, end = 0x080FB488, fmt = "record", fields = "bbbbbbbbw" },  # BN4_STORY_BATTLES (245 x 12B)
]

[[segment]]
name = "code_10"
start = 0x08109F04
end = 0x08120014
kind = "code"
mode = "thumb"
data_from = 0x08113CCC   # build timestamp ("Apr 16 2004 14:36:29") + m4a PCM audio samples
jumptables = [
    { addr = 0x08110DB8, count = 5 },
    { addr = 0x08113A84, count = 18 },
]
arm_ranges = [
    { start = 0x08111B1C, end = 0x08111B28 },
    { start = 0x08111BB8, end = 0x08111C0C },
    { start = 0x08111D44, end = 0x08111F2C },
]
