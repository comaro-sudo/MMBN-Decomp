# Segment split for US Red Sun (B4WE). Ranges not listed stay .incbin.
# kind: "header" (hand-written asm), "code" (asm/<name>.s from tools/disasm.py),
#       "incbin" (explicit binary range, e.g. Nintendo logo or graphics)
# mode: "arm" | "thumb" (initial decode mode for code segments)
# bm_delta: Blue Moon address = RS address + bm_delta inside this segment
# entries: extra code entry points inside the segment (besides known function starts)
# data_from: everything from here to the segment end is data (literal pools, tables)

version = "rs"
rom_size = 0x800000

[[segment]]
name = "header"
bm_delta = 0x0
start = 0x08000000
end = 0x080000C0
kind = "header"

[[segment]]
name = "crt0"
bm_delta = 0x0
start = 0x080000C0
end = 0x0800022C
kind = "code"
mode = "arm"
linear = true            # decode straight through until data_from
data_from = 0x080001D8   # literal pool
entries = [0x080000C0]

[[segment]]
name = "intr_table"
bm_delta = 0x0
start = 0x0800022C
end = 0x0800025C
kind = "code"            # pure data: emitted as .word by disasm.py
mode = "arm"
data_from = 0x0800022C

# --- Thumb code. Boundaries sit on function starts and on the RS/BM shift
# --- regions (notes/dc1-survey.md) so each segment has one BM delta.

[[segment]]
name = "code_00"
bm_delta = 0x0
start = 0x0800025C
end = 0x0801002A
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0x0
name = "code_01"
bm_delta = 0x0
start = 0x0801002A
end = 0x08020D6C
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x08011888, end = 0x08012470, fmt = "record", fields = "hbbbbbbu" }, # BN4_ENEMY_STATS (254 x 12B)
    { start = 0x08017FB8, end = 0x08018068, fmt = "word" },                          # BN4_BATTLE_TABLES root: 2 roots + 21 group pointers
    { start = 0x08016C04, end = 0x08017A28, fmt = "word" },                          # 0xE24-byte pointer table (95% ROM pointers)
]

[[segment]]   # BM delta +0x4
name = "code_02"
bm_delta = 0x4
start = 0x08020D6C
end = 0x08035088
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x0802793C, end = 0x08028038, fmt = "word" },   # pointer table (100% pointers)
    { start = 0x0802831C, end = 0x08028904, fmt = "word" },   # pointer table (98% pointers)
    { start = 0x0802891C, end = 0x08028F04, fmt = "word" },   # pointer table (98% pointers)
]

[[segment]]   # BM delta +0x8
name = "code_03"
bm_delta = 0x8
start = 0x08035088
end = 0x0804F21C
kind = "code"
mode = "thumb"
# dead code after an unconditional b (no branch or pointer reaches it); decoded for coverage (Claude)
entries = [0x08037C58, 0x08037D30]

[[segment]]   # BM delta +0xC
name = "code_04"
bm_delta = 0xC
start = 0x0804F21C
end = 0x0805CF5C
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x080523C0, end = 0x080538F8, fmt = "word" }, # 723-pointer sprite/object table
]

# code_04 is split where the RS->BM delta changes inside it: three cutscene-script
# tables insert or delete 14-byte commands (notes/dc4-version-differences.md 2.2/3).
[[segment]]   # BM delta +0x18
name = "code_04b"
bm_delta = 0x18
start = 0x0805CF5C
end = 0x080612C8
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0x14
name = "code_04c"
bm_delta = 0x14
start = 0x080612C8
end = 0x0806765C
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0xC
name = "code_04d"
bm_delta = 0xC
start = 0x0806765C
end = 0x080711E4
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0xC
name = "code_05"
bm_delta = 0xC
start = 0x080711E4
end = 0x08094758
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x080843F0, end = 0x080853F8, fmt = "word" }, # 370-pointer table
]

[[segment]]   # BM delta +0xC
name = "code_06"
bm_delta = 0xC
start = 0x08094758
end = 0x080B01DE
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x080A78C8, end = 0x080A7C28, fmt = "word" }, # 96-pointer table
    { start = 0x080A7C60, end = 0x080A7EC0, fmt = "word" }, # 96-pointer table
    { start = 0x080A9110, end = 0x080ADD8C, fmt = "word" }, # BN4_MYSTERY_DATA (414 pointers, RW+CW)
]

[[segment]]   # BM delta +0xC
name = "code_07"
bm_delta = 0xC
start = 0x080B01DE
end = 0x080D00B8
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0xC
name = "code_08"
bm_delta = 0xC
start = 0x080D00B8
end = 0x080F0012
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0xC
name = "code_09"
bm_delta = 0xC
start = 0x080F0012
end = 0x08109EF0   # the +0xC -> +0x14 shift is inside sub_08109E48, just before
kind = "code"
mode = "thumb"
data_tables = [
    { start = 0x080F5F50, end = 0x080F8A70, fmt = "hword", cols = 10 },              # BN4_REWARD_ROWS (276 x 20 hwords)
    { start = 0x080FA900, end = 0x080FB47C, fmt = "record", fields = "bbbbbbbbw" },  # BN4_STORY_BATTLES (245 x 12B)
    { start = 0x080FC138, end = 0x08102FC8, fmt = "word" },                          # encounter map-pointer arrays + 12-byte battle records (RE-06 4)
]

[[segment]]   # BM delta +0x14, includes m4a
name = "code_10"
bm_delta = 0x14
start = 0x08109EF0
end = 0x08120000
kind = "code"
mode = "thumb"
data_from = 0x08113CB8   # build timestamp ("Apr 16 2004 14:40:18") + m4a PCM audio samples
jumptables = [
    { addr = 0x08110DA4, count = 5 },
    { addr = 0x08113A70, count = 18 },
]
arm_ranges = [
    { start = 0x08111B08, end = 0x08111B14 },
    { start = 0x08111BA4, end = 0x08111BF8 },
    { start = 0x08111D30, end = 0x08111F18 },
]
