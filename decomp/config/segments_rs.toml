# Segment split for US Red Sun (B4WE). Ranges not listed stay .incbin.
# kind: "header" (hand-written asm), "code" (asm/<name>.s from tools/disasm.py),
#       "incbin" (explicit binary range, e.g. Nintendo logo or graphics)
# mode: "arm" | "thumb" (initial decode mode for code segments)
# entries: extra code entry points inside the segment (besides known function starts)
# data_from: everything from here to the segment end is data (literal pools, tables)

version = "rs"
rom_size = 0x800000

[[segment]]
name = "header"
start = 0x08000000
end = 0x080000C0
kind = "header"

[[segment]]
name = "crt0"
start = 0x080000C0
end = 0x0800022C
kind = "code"
mode = "arm"
linear = true            # decode straight through until data_from
data_from = 0x080001D8   # literal pool
entries = [0x080000C0]

[[segment]]
name = "intr_table"
start = 0x0800022C
end = 0x0800025C
kind = "code"            # pure data: emitted as .word by disasm.py
mode = "arm"
data_from = 0x0800022C

# --- Thumb code. Boundaries sit on function starts and on the RS/BM shift
# --- regions (notes/dc1-survey.md) so each segment has one BM delta.

[[segment]]
name = "code_00"
start = 0x0800025C
end = 0x0801002A
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0x0
name = "code_01"
start = 0x0801002A
end = 0x08020D6C
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0x4
name = "code_02"
start = 0x08020D6C
end = 0x08035088
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0x8
name = "code_03"
start = 0x08035088
end = 0x0804F21C
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0xC
name = "code_04"
start = 0x0804F21C
end = 0x080711E4
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0xC
name = "code_05"
start = 0x080711E4
end = 0x08094758
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0xC
name = "code_06"
start = 0x08094758
end = 0x080B01DE
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0xC
name = "code_07"
start = 0x080B01DE
end = 0x080D00B8
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0xC
name = "code_08"
start = 0x080D00B8
end = 0x080F0012
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0xC
name = "code_09"
start = 0x080F0012
end = 0x0810A1B4
kind = "code"
mode = "thumb"

[[segment]]   # BM delta +0x14, includes m4a
name = "code_10"
start = 0x0810A1B4
end = 0x08120000
kind = "code"
mode = "thumb"
